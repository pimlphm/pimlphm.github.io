name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
    # Retry a missed weekly verification or a later failed attempt.
    - cron: '47 6 * * 2,3'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build publication and project catalogues
        run: npm run content:build
      - name: Refresh approved Google Scholar data
        id: scholar-sync
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # Google occasionally blocks shared GitHub runner addresses.  Do not let
        # that temporary upstream block prevent the scheduled Pages redeploy.
        continue-on-error: true
        run: npm run refresh:scholar
      - name: Test publication uploads
        run: npm run test:content
      - name: Test Scholar parser
        run: npm run test:scholar-sync
      - name: Test English site
        run: npm run test:site
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build:github
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Persist automatically refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(data/scholar\.json|data/publications\.generated\.json|data/projects\.generated\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files changed during automatic refresh:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git add data/scholar.json data/publications.generated.json data/projects.generated.json
          if git diff --cached --quiet; then
            echo 'No data changes to persist; see the Scholar verification summary.'
            exit 0
          fi
          git config user.name 'pimlphm-site-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public site data [skip ci]'
          git push origin HEAD:main
      - name: Report Scholar refresh status
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/refresh-scholar.mjs --report
